[package]
name = "another-core"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
byteorder = "1"
socket2 = "0.5"
getrandom = "0.2"
base64 = "0.22"
roxmltree = "0.20"
libadb = { version = "=0.9.0", features = ["tokio", "host-keys"] }
